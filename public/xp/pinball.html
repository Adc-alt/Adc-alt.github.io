<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>3D Pinball for Windows - Space Cadet</title>

    <!--
      3D Pinball: Space Cadet, in a page of ours rather than one of theirs.

      WHY THIS FILE EXISTS. The game used to be framed straight from
      pinball.alula.me, and a frame from another origin is a room you cannot
      enter: its music could not be turned off, its sound could not be turned
      down, and its own window chrome (a second title bar, inside ours) came
      along whether or not it made sense. This page loads the same engine from
      the same server — their files answer with `access-control-allow-origin: *`
      — but runs it HERE, so the canvas, the sizing and the audio are ours to
      deal with.

      WHAT IS NOT OURS. The engine is k4zmu2a's decompilation of the original,
      compiled to WebAssembly by alula, and it is MIT. The game data — the
      table, the sprites, the sounds — is Microsoft's, is not redistributable,
      and is NOT in this repository: every byte of it is fetched from their
      server at the moment you press Load, and never before.
    -->
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #000000;
        color: #d8e6f8;
        font: 12px Tahoma, "DejaVu Sans", Verdana, sans-serif;
      }
      /* ⚠️ These two lines are the whole full-screen story. The engine reads
         the canvas' CSS size and sets its own pixel size to match, so filling
         the page means the game RENDERS at the size of the page instead of
         being a 600x440 picture stretched to fit — which is what full screen
         looked like while this was framed from their own page. It keeps the
         table's proportions itself and fills the rest with black.
         No `object-fit`: it would letterbox inside the box while the mouse
         mapping kept using the box, putting every click a few pixels out. */
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #canvas[hidden] {
        display: none;
      }
      #status {
        margin: 0;
      }
    </style>
  </head>

  <body>
    <p id="status">Loading…</p>
    <canvas id="canvas" tabindex="-1" hidden></canvas>

    <script>
      const HOST = "https://pinball.alula.me/";
      const canvas = document.getElementById("canvas");
      const status = document.getElementById("status");
      canvas.addEventListener("contextmenu", (e) => e.preventDefault());

      /* ⚠️ NOTHING here sizes the canvas, on purpose. The engine picks its own
         pixel size from the window and follows it when the window changes, so
         it renders at the real resolution instead of being a small picture
         stretched — which is what full screen looked like when this was framed
         from their page, and the reason it is not framed from there any more.
         A `fit()` on top of that also loops: our CSS size feeds their pixel
         size feeds our CSS size. Body flex does the centring; that is all. */

      window.Module = {
        canvas,
        // Their build fetches its .wasm and .data next to the script, and the
        // script is not next to this page.
        locateFile: (path) => HOST + path,
        print: () => {},
        printErr: (text) => console.error(text),
        setStatus: (text) => {
          status.textContent = text || "";
          status.hidden = !text;
        },
        onRuntimeInitialized: () => {
          canvas.hidden = false;
        },
      };

      /* ── No music ──────────────────────────────────────────────────────────
         The music is two MIDI files in the game's data package and nothing
         else: every other sound in there is a .WAV, which is an effect. Hand
         the game an empty file where each MIDI should be and it comes up with
         nothing to play — its own Options → Music switch greys itself out —
         while every effect is untouched.

         ⚠️ This replaces a blind click on that menu item, fired on a 700ms
         timer. That was a race, and it lost: throttle the CPU to a sixth and
         the game has not drawn its menu bar yet, the click lands on nothing,
         and the music plays for the rest of the session with no sign that
         anything failed. A slow machine is not an edge case.

         The property is an accessor because the engine's own loader assigns
         it during startup, long after this page has handed over `Module`;
         `writeFile` is whatever it assigned. Non-enumerable on purpose: the
         loader copies every enumerable key of `Module` onto itself first, and
         copying a getter's result would feed the wrapper back through the
         setter and leave it calling itself. */
      /* ── The flippers on the arrow keys ────────────────────────────────────
         The game's own keys are Z and / — the original's, and the ones its
         keymapper still lists — and the owner wanted the arrows. The keymapper
         is drawn inside the canvas and its settings live in a file this page
         never sees, so the rebinding does not happen there: the arrows are
         translated into the keys the game is already listening for, here, on
         the way in.

         ⚠️ `keyup` matters as much as `keydown`. Miss it and the flipper is
         held up for the rest of the game, which looks like the ball has broken
         rather than like a missing line.

         Dispatched on the canvas and left to bubble, because SDL's listener is
         on the window: an event that does not bubble arrives nowhere. The
         translated event carries `code` as well as `key`, because `code` — the
         physical key — is what SDL reads first. No loop is possible: what comes
         out is `KeyZ`, and nothing maps that.

         The real arrow press is NOT stopped, only its default (the page
         scrolling under the game). Left and right are unbound in the original,
         so the game receives one it does nothing with; ArrowUp is the bottom
         table bump and is deliberately not in this table. */
      const FLIPPERS = {
        ArrowLeft: { key: "z", code: "KeyZ", keyCode: 90 },
        ArrowRight: { key: "/", code: "Slash", keyCode: 191 },
      };
      for (const type of ["keydown", "keyup"]) {
        addEventListener(type, (e) => {
          const to = FLIPPERS[e.key];
          if (!to || e.ctrlKey || e.altKey || e.metaKey) return;
          e.preventDefault();
          canvas.dispatchEvent(
            new KeyboardEvent(type, { ...to, which: to.keyCode, repeat: e.repeat, bubbles: true }),
          );
        });
      }

      const MUSIC_FILE = /PINBALL2?\.MID$/i;
      let writeFile = null;
      Object.defineProperty(window.Module, "FS_createDataFile", {
        configurable: true,
        set: (fn) => {
          writeFile = fn;
        },
        // The packager passes the whole path as `parent` and nothing as `name`.
        get: () => (parent, name, data, ...rest) =>
          writeFile(parent, name, MUSIC_FILE.test(name ?? parent) ? new Uint8Array(0) : data, ...rest),
      });
    </script>
    <script async src="https://pinball.alula.me/SpaceCadetPinball.js"></script>
  </body>
</html>
