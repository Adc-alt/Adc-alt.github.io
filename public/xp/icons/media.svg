<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The Windows Media play button: one triangle cut in four, painted in the
    colours of the Windows flag. Drawn rather than lifted, like the account
    picture — same shapes, ours.

    The cut is a horizontal line through the middle and a vertical one a little
    right of it. Where exactly is the whole job: the triangle narrows towards
    the tip, so cutting down the geometric middle leaves two slivers on the
    right, and cutting where the areas match leaves the left pair as thin
    columns. x=14.5 is the compromise that looks like four pieces of one shape.
    Each quarter is then nudged 0.6px away from the centre; the cross of
    background showing through the gap is what separates them.
  -->
  <polygon points="7.4,3.5 13.9,8.1 13.9,15.5 7.4,15.5" fill="#f65314" />
  <polygon points="15.1,8.1 25.6,15.5 15.1,15.5" fill="#7cbb00" />
  <polygon points="7.4,16.5 13.9,16.5 13.9,23.9 7.4,28.5" fill="#00a1f1" />
  <polygon points="15.1,16.5 25.6,16.5 15.1,23.9" fill="#ffbb00" />
</svg>
