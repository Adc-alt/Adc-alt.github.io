<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="A grey desktop computer">
  <title>A grey desktop computer</title>

  <!-- The tab can be light or dark, so the icon brings its own background
       instead of depending on the browser theme. -->
  <rect width="32" height="32" rx="4" fill="#1d2733"/>

  <!-- Monitor case. #d4d0c8 is the Windows "3D face" grey — the colour every
       beige box and every dialog of that era was painted in.
       It fills nearly the whole box on purpose: at 16px the case is about three
       device pixels of bezel, and any padding around it eats the shape before
       the shape reads. -->
  <rect x="2" y="3" width="28" height="21" rx="2" fill="#d4d0c8"/>
  <!-- Top-left highlight and bottom-right shade: the two lines that make a flat
       rectangle read as a raised plastic box. -->
  <path d="M3 23V4h26" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.8"/>
  <path d="M3 23h26V4" fill="none" stroke="#8d897f" stroke-width="1.4"/>

  <!-- Screen, sunken. Not grey: grey on grey is a blank rectangle at 16px, and
       the tube has to be the darkest thing in the icon to read as one. -->
  <rect x="5" y="6" width="22" height="15" fill="#16283d"/>
  <!-- A hint of the desktop inside, so it looks switched on. -->
  <rect x="5" y="16" width="22" height="5" fill="#2f6fbf" opacity="0.6"/>

  <!-- Power LED. One green pixel is what says the machine is running. -->
  <circle cx="27.5" cy="22.5" r="1.1" fill="#7cd94f"/>

  <!-- Neck and base. -->
  <rect x="13" y="24" width="6" height="3" fill="#bdb9b1"/>
  <rect x="7" y="26" width="18" height="4" rx="1.5" fill="#d4d0c8"/>
  <path d="M8 27h16" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
</svg>
